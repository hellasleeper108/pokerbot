<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Texas Hold'em Poker Bot - AI Powered</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #667eea;
            font-size: 1.5em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
        }

        input::placeholder {
            color: #666;
        }

        .card-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 20px;
        }

        .result-card {
            background: rgba(76, 175, 80, 0.1);
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .result-card.warning {
            background: rgba(255, 193, 7, 0.1);
            border-left-color: #ffc107;
        }

        .result-card.danger {
            background: rgba(244, 67, 54, 0.1);
            border-left-color: #f44336;
        }

        .progress-bar {
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .progress-win {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .progress-tie {
            background: linear-gradient(90deg, #ffc107, #ffeb3b);
        }

        .progress-loss {
            background: linear-gradient(90deg, #f44336, #ff5722);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
        }

        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        .gto-badge {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .recommendation {
            font-size: 1.3em;
            font-weight: bold;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin: 20px 0;
        }

        .recommendation.call {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
        }

        .recommendation.fold {
            background: linear-gradient(135deg, #f44336, #ff5722);
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎰 Texas Hold'em Poker Bot</h1>
            <p class="subtitle">AI-Powered Probability Calculator with GTO Solver</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab('analyzer')">📊 Hand Analyzer</button>
            <button class="tab" onclick="showTab('preflop')">🃏 Pre-flop Charts</button>
            <button class="tab" onclick="showTab('batch')">📋 Batch Analysis</button>
            <button class="tab" onclick="showTab('stats')">📈 Statistics</button>
        </div>

        <!-- Hand Analyzer Tab -->
        <div id="analyzer" class="tab-content active">
            <div class="main-grid">
                <div class="card">
                    <h2>Your Hand</h2>
                    <div class="input-group">
                        <label>Hole Cards (e.g., As Kh)</label>
                        <input type="text" id="holeCards" placeholder="As Kd" value="As Kd">
                    </div>
                    <div class="input-group">
                        <label>Community Cards (e.g., Ah 7s 3c)</label>
                        <input type="text" id="communityCards" placeholder="Ah 7s 3c or leave empty">
                    </div>
                    <div class="input-group">
                        <label>Number of Opponents</label>
                        <input type="number" id="numOpponents" value="2" min="1" max="9">
                    </div>
                    <div class="input-group">
                        <label>Your Position</label>
                        <select id="position">
                            <option value="UTG">UTG (Early)</option>
                            <option value="MP">MP (Middle)</option>
                            <option value="CO">CO (Cutoff)</option>
                            <option value="BTN" selected>BTN (Button)</option>
                            <option value="SB">SB (Small Blind)</option>
                            <option value="BB">BB (Big Blind)</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <h2>Pot Information</h2>
                    <div class="input-group">
                        <label>Current Pot Size ($)</label>
                        <input type="number" id="potSize" value="100" min="0" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>Bet to Call ($)</label>
                        <input type="number" id="betToCall" value="20" min="0" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>Your Stack Size ($)</label>
                        <input type="number" id="stackSize" value="500" min="0" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>Number of Simulations</label>
                        <select id="simulations">
                            <option value="1000">1,000 (Fast)</option>
                            <option value="5000" selected>5,000 (Balanced)</option>
                            <option value="10000">10,000 (Accurate)</option>
                            <option value="20000">20,000 (Very Accurate)</option>
                        </select>
                    </div>
                    <button onclick="analyzeHand()">🎲 Analyze Hand</button>
                </div>
            </div>

            <div id="results" class="results"></div>
        </div>

        <!-- Pre-flop Charts Tab -->
        <div id="preflop" class="tab-content">
            <div class="card">
                <h2>Pre-flop Starting Hands by Position</h2>
                <div class="input-group">
                    <label>Select Position</label>
                    <select id="chartPosition">
                        <option value="UTG">UTG (Early Position)</option>
                        <option value="MP">MP (Middle Position)</option>
                        <option value="CO">CO (Cutoff)</option>
                        <option value="BTN" selected>BTN (Button)</option>
                        <option value="SB">SB (Small Blind)</option>
                        <option value="BB">BB (Big Blind)</option>
                    </select>
                </div>
                <button onclick="loadPreflopChart()">📊 Load Chart</button>
                <div id="chartResults" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Batch Analysis Tab -->
        <div id="batch" class="tab-content">
            <div class="card">
                <h2>Batch Scenario Analysis</h2>
                <p style="margin-bottom: 15px; color: #888;">Analyze multiple scenarios at once</p>
                <div class="input-group">
                    <label>Scenario 1 (Name | Hole | Board | Opponents)</label>
                    <input type="text" id="scenario1" placeholder="Pocket Aces | As Ah | | 2">
                </div>
                <div class="input-group">
                    <label>Scenario 2</label>
                    <input type="text" id="scenario2" placeholder="Top Pair | As Kd | Ah 7s 3c | 2">
                </div>
                <div class="input-group">
                    <label>Scenario 3</label>
                    <input type="text" id="scenario3" placeholder="Flush Draw | Ah 7h | Kh 3h 2c | 1">
                </div>
                <button onclick="batchAnalyze()">⚡ Analyze All Scenarios</button>
                <div id="batchResults" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Statistics Tab -->
        <div id="stats" class="tab-content">
            <div class="card">
                <h2>Session Statistics</h2>
                <button onclick="loadStats()">🔄 Refresh Statistics</button>
                <div id="statsResults" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(button => {
                button.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function analyzeHand() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing hand...</p></div>';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        hole_cards: document.getElementById('holeCards').value.trim().split(/\s+/),
                        community_cards: document.getElementById('communityCards').value.trim().split(/\s+/).filter(c => c),
                        num_opponents: parseInt(document.getElementById('numOpponents').value),
                        pot_size: parseFloat(document.getElementById('potSize').value),
                        bet_to_call: parseFloat(document.getElementById('betToCall').value),
                        stack_size: parseFloat(document.getElementById('stackSize').value),
                        position: document.getElementById('position').value,
                        simulations: parseInt(document.getElementById('simulations').value)
                    })
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="result-card danger"><strong>Error:</strong> ${data.error}</div>`;
                    return;
                }

                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-card danger"><strong>Error:</strong> ${error.message}</div>`;
            }
        }

        function displayResults(data) {
            const prob = data.probabilities;
            const potAnalysis = data.pot_analysis;
            const gto = data.gto_recommendation;

            let html = '<div class="card">';

            // Main recommendation
            if (potAnalysis) {
                const recClass = potAnalysis.recommendation === 'CALL' ? 'call' : 'fold';
                html += `<div class="recommendation ${recClass}">
                    ${potAnalysis.recommendation === 'CALL' ? '✅' : '❌'} ${potAnalysis.recommendation}
                </div>`;
            }

            // Probabilities
            html += '<h2>Win Probabilities</h2>';
            html += '<div class="stat-grid">';
            html += `<div class="stat-box"><div class="stat-value" style="color: #4caf50">${prob.win.toFixed(1)}%</div><div class="stat-label">Win</div></div>`;
            html += `<div class="stat-box"><div class="stat-value" style="color: #ffc107">${prob.tie.toFixed(1)}%</div><div class="stat-label">Tie</div></div>`;
            html += `<div class="stat-box"><div class="stat-box"><div class="stat-value" style="color: #f44336">${prob.loss.toFixed(1)}%</div><div class="stat-label">Loss</div></div>`;
            html += '</div>';

            // Progress bars
            html += `<div class="progress-bar"><div class="progress-fill progress-win" style="width: ${prob.win}%">${prob.win.toFixed(1)}%</div></div>`;

            // Hand info
            if (data.hand_rank) {
                html += `<div class="result-card"><strong>Current Hand:</strong> ${data.hand_rank}</div>`;
            }

            html += `<div class="result-card"><strong>Chen Score:</strong> ${data.chen_score.toFixed(1)} (${data.hand_category})</div>`;

            // Pot odds
            if (potAnalysis) {
                html += `<h2>Pot Odds Analysis</h2>`;
                html += `<div class="result-card ${potAnalysis.expected_value >= 0 ? '' : 'danger'}">`;
                html += `<p><strong>Pot Odds Required:</strong> ${potAnalysis.pot_odds.toFixed(1)}%</p>`;
                html += `<p><strong>Your Equity:</strong> ${prob.win_or_tie.toFixed(1)}%</p>`;
                html += `<p><strong>Expected Value:</strong> $${potAnalysis.expected_value.toFixed(2)}</p>`;
                html += '</div>';
            }

            // GTO recommendation
            if (gto) {
                html += `<h2>GTO Recommendation <span class="ai-badge gto-badge">GTO</span></h2>`;
                html += `<div class="result-card">`;
                html += `<p><strong>Action:</strong> ${gto.action}</p>`;
                html += `<p><strong>Optimal Bet Size:</strong> $${gto.optimal_bet_size}</p>`;
                html += `<p><strong>Reasoning:</strong> ${gto.reasoning}</p>`;
                html += `<p style="color: #888; margin-top: 10px;">${gto.note}</p>`;
                html += '</div>';
            }

            // AI Opponent Analysis
            if (data.opponent_analysis) {
                html += `<h2>AI Opponent Analysis <span class="ai-badge">AI</span></h2>`;
                const ranges = data.opponent_analysis.estimated_ranges;
                html += `<div class="result-card">`;
                html += `<p><strong>Board Texture:</strong> ${data.opponent_analysis.board_texture.type}</p>`;
                html += `<p><strong>Made Hands:</strong> ${ranges.made_hands.toFixed(0)}%</p>`;
                html += `<p><strong>Drawing Hands:</strong> ${ranges.drawing_hands.toFixed(0)}%</p>`;
                html += `<p><strong>Bluffs:</strong> ${ranges.bluffs.toFixed(0)}%</p>`;
                html += `<p style="margin-top: 10px; font-style: italic;">${data.opponent_analysis.recommendation}</p>`;
                html += '</div>';
            }

            html += '</div>';
            document.getElementById('results').innerHTML = html;
        }

        async function loadPreflopChart() {
            const position = document.getElementById('chartPosition').value;
            const resultsDiv = document.getElementById('chartResults');
            resultsDiv.innerHTML = '<div class="loading"><p>Loading chart...</p></div>';

            try {
                const response = await fetch(`/api/preflop-chart?position=${position}`);
                const data = await response.json();

                let html = '<div class="card">';
                html += `<h3>${data.position} Starting Hands</h3>`;

                for (const [category, hands] of Object.entries(data.ranges)) {
                    if (hands.length > 0) {
                        html += `<h4 style="margin-top: 20px; color: #667eea;">${category}</h4>`;
                        html += '<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;">';
                        hands.forEach(hand => {
                            html += `<span style="background: rgba(102, 126, 234, 0.2); padding: 5px 10px; border-radius: 5px;">${hand}</span>`;
                        });
                        html += '</div>';
                    }
                }

                html += '</div>';
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-card danger">Error: ${error.message}</div>`;
            }
        }

        async function batchAnalyze() {
            const resultsDiv = document.getElementById('batchResults');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing scenarios...</p></div>';

            const scenarios = [];
            for (let i = 1; i <= 3; i++) {
                const input = document.getElementById(`scenario${i}`).value.trim();
                if (input) {
                    const parts = input.split('|').map(p => p.trim());
                    if (parts.length >= 3) {
                        scenarios.push({
                            name: parts[0],
                            hole_cards: parts[1].split(/\s+/),
                            community_cards: parts[2] ? parts[2].split(/\s+/) : [],
                            num_opponents: parseInt(parts[3]) || 1
                        });
                    }
                }
            }

            if (scenarios.length === 0) {
                resultsDiv.innerHTML = '<div class="result-card warning">Please enter at least one scenario</div>';
                return;
            }

            try {
                const response = await fetch('/api/batch-analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        scenarios: scenarios,
                        simulations: 3000
                    })
                });

                const data = await response.json();

                let html = '<div class="card"><h3>Batch Analysis Results</h3>';
                html += '<table style="width: 100%; margin-top: 20px; border-collapse: collapse;">';
                html += '<tr style="border-bottom: 2px solid rgba(255,255,255,0.1);"><th style="padding: 10px; text-align: left;">Scenario</th><th>Win %</th><th>Tie %</th><th>Loss %</th></tr>';

                data.results.forEach(result => {
                    const prob = result.probabilities;
                    html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">`;
                    html += `<td style="padding: 10px;">${result.name}</td>`;
                    html += `<td style="padding: 10px; text-align: center; color: #4caf50;">${prob.win.toFixed(1)}%</td>`;
                    html += `<td style="padding: 10px; text-align: center; color: #ffc107;">${prob.tie.toFixed(1)}%</td>`;
                    html += `<td style="padding: 10px; text-align: center; color: #f44336;">${prob.loss.toFixed(1)}%</td>`;
                    html += '</tr>';
                });

                html += '</table></div>';
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-card danger">Error: ${error.message}</div>`;
            }
        }

        async function loadStats() {
            const resultsDiv = document.getElementById('statsResults');
            resultsDiv.innerHTML = '<div class="loading"><p>Loading statistics...</p></div>';

            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                if (!data.total_hands || data.total_hands === 0) {
                    resultsDiv.innerHTML = '<div class="result-card">No hands tracked yet. Use the tracker tools to add data.</div>';
                    return;
                }

                let html = '<div style="margin-top: 20px;">';
                html += `<h3>Total Hands: ${data.total_hands}</h3>`;
                html += `<p>Average Equity: ${data.average_equity.toFixed(1)}%</p>`;

                if (data.total_profit !== undefined) {
                    const profitColor = data.total_profit >= 0 ? '#4caf50' : '#f44336';
                    html += `<p>Total Profit: <span style="color: ${profitColor}">$${data.total_profit.toFixed(2)}</span></p>`;
                }

                html += '</div>';
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result-card danger">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
